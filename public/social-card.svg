<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAF5EE"/>
  <!-- Warm gradient overlays -->
  <rect width="1200" height="630" fill="url(#bgGrad)" opacity="0.6"/>
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C4654A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FAF5EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGrad2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#7A9E7E" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FAF5EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad2)" opacity="0.6"/>

  <!-- Decorative orbital rings (top-right area) -->
  <ellipse cx="900" cy="200" rx="220" ry="80" stroke="#C4654A" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.15"/>
  <ellipse cx="900" cy="200" rx="300" ry="110" stroke="#D4A574" stroke-width="1" stroke-dasharray="4 10" opacity="0.1"/>
  <ellipse cx="900" cy="200" rx="380" ry="140" stroke="#7A9E7E" stroke-width="0.8" stroke-dasharray="3 12" opacity="0.08"/>

  <!-- Star nodes on orbits -->
  <circle cx="720" cy="160" r="5" fill="#C4654A" opacity="0.4"/>
  <circle cx="1080" cy="180" r="4" fill="#7A9E7E" opacity="0.35"/>
  <circle cx="850" cy="110" r="6" fill="#C4654A" opacity="0.25"/>
  <circle cx="980" cy="280" r="4" fill="#D4A574" opacity="0.3"/>
  <circle cx="760" cy="250" r="3.5" fill="#7A9E7E" opacity="0.25"/>

  <!-- Book icon (left side) -->
  <g transform="translate(120, 200)">
    <!-- Open book -->
    <path d="M0 120 C0 120 30 105 80 105 C130 105 160 120 160 120 L160 20 C160 20 130 5 80 5 C30 5 0 20 0 20 Z" fill="#FDFBF7" stroke="#2D2926" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="80" y1="5" x2="80" y2="105" stroke="#2D2926" stroke-width="3"/>
    <!-- Left page lines -->
    <line x1="20" y1="40" x2="68" y2="37" stroke="#C4654A" stroke-width="2" opacity="0.4"/>
    <line x1="20" y1="55" x2="68" y2="52" stroke="#C4654A" stroke-width="2" opacity="0.3"/>
    <line x1="20" y1="70" x2="60" y2="67" stroke="#C4654A" stroke-width="2" opacity="0.2"/>
    <!-- Right page lines -->
    <line x1="92" y1="37" x2="140" y2="40" stroke="#7A9E7E" stroke-width="2" opacity="0.4"/>
    <line x1="92" y1="52" x2="140" y2="55" stroke="#7A9E7E" stroke-width="2" opacity="0.3"/>
    <line x1="92" y1="67" x2="132" y2="70" stroke="#7A9E7E" stroke-width="2" opacity="0.2"/>
    <!-- Orbital arc above book -->
    <ellipse cx="80" cy="0" rx="65" ry="22" stroke="#C4654A" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.5"/>
    <ellipse cx="80" cy="0" rx="90" ry="32" stroke="#C4654A" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.25"/>
    <!-- Nodes -->
    <circle cx="18" cy="-8" r="5" fill="#C4654A" opacity="0.7"/>
    <circle cx="142" cy="-5" r="4.5" fill="#7A9E7E" opacity="0.6"/>
    <circle cx="80" cy="-22" r="5.5" fill="#C4654A" opacity="0.5"/>
  </g>

  <!-- Project name -->
  <text x="340" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#2D2926" letter-spacing="-1">
    GrowthVerse · 成长宇宙
  </text>

  <!-- Tagline -->
  <text x="340" y="330" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#C4654A" font-weight="500" letter-spacing="0.5">
    AI 驱动的沉浸式阅读伴侣
  </text>

  <!-- Description -->
  <text x="340" y="385" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#4A4440" opacity="0.8">
    从一本书出发，通过 AI 多 Agent 协作，无限展开你的知识探索网络
  </text>

  <!-- Feature pills -->
  <g transform="translate(340, 420)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="#C4654A" opacity="0.1"/>
    <text x="70" y="23" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#C4654A" text-anchor="middle" font-weight="500">5 AI Agents</text>

    <rect x="155" y="0" width="160" height="36" rx="18" fill="#7A9E7E" opacity="0.1"/>
    <text x="235" y="23" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#5C7E60" text-anchor="middle" font-weight="500">图书宇宙探索</text>

    <rect x="330" y="0" width="160" height="36" rx="18" fill="#D4A574" opacity="0.12"/>
    <text x="410" y="23" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#B08550" text-anchor="middle" font-weight="500">社交阅读脉搏</text>

    <rect x="505" y="0" width="140" height="36" rx="18" fill="#C4654A" opacity="0.1"/>
    <text x="575" y="23" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#C4654A" text-anchor="middle" font-weight="500">成长地图</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="600" width="1200" height="30" fill="#2D2926" opacity="0.04"/>
  <text x="600" y="618" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9A9088" text-anchor="middle">
    外滩大会 · 黑客松 2026 — AI Coding 大赛  ·  每一本书，都是一条新的路径
  </text>

  <!-- Subtle border -->
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="#E8E0D6" stroke-width="2"/>
</svg>
